<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vũ Nguyệt Ánh — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    :root {
      --ink: #25313b;
      --muted: #68727a;
      --peach: #f5c6b2;
      --peach-light: #f9e5dc;
      --peach-deep: #e99a78;
      --cream: #fbf7f3;
      --white: #ffffff;

      --serif: "Playfair Display", Georgia, serif;
      --sans: "DM Sans", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(
          circle at 75% 20%,
          rgba(245, 198, 178, 0.72),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #fbf7f3 0%,
          #f8eee8 55%,
          #f2d8cc 100%
        );

      font-family: var(--sans);
      line-height: 1.65;
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: absolute;
      z-index: 10;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);

      width: min(1050px, calc(100% - 40px));

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px 18px;

      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 999px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 12px 35px rgba(50, 38, 31, 0.08);
    }

    .brand {
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang {
      border: 0;
      background: transparent;

      padding: 7px 10px;

      border-radius: 999px;

      color: #68727a;

      font: 700 10px var(--sans);

      cursor: pointer;
      transition: 0.2s ease;
    }

    .lang:hover,
    .lang.active {
      color: var(--ink);
      background: var(--peach-light);
    }

    /* =========================
       MAIN
    ========================= */

    .coming-soon {
      flex: 1;

      min-height: 100vh;

      display: flex;
      align-items: center;

      padding: 110px 0 70px;
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    .coming-grid {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;

      gap: 60px;

      align-items: center;
    }

    /* =========================
       TEXT
    ========================= */

    .content {
      padding-left: 4%;
    }

    .kicker {
      margin: 0 0 12px;

      color: #a36e59;

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;

      font-family: var(--serif);

      font-size: clamp(55px, 7vw, 90px);

      line-height: 0.95;
      letter-spacing: -0.055em;

      font-weight: 600;
    }

    .title em {
      display: block;

      color: #b67f67;

      font-style: italic;
      font-weight: 500;
    }

    .line {
      width: 75px;
      height: 3px;

      margin: 30px 0 22px;

      background: var(--peach-deep);

      border-radius: 99px;
    }

    .description {
      max-width: 430px;

      margin: 0;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.8;
    }

    .description strong {
      color: var(--ink);
      font-weight: 600;
    }

    /* =========================
       BUTTON
    ========================= */

    .actions {
      display: flex;
      flex-wrap: wrap;

      gap: 10px;

      margin-top: 30px;
    }

    .contact-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 9px;

      padding: 12px 20px;

      border-radius: 999px;

      color: var(--ink);

      background: linear-gradient(
        180deg,
        #ffffff,
        #f4bda7
      );

      border: 1px solid rgba(183, 125, 101, 0.18);

      text-decoration: none;

      font-size: 12px;
      font-weight: 700;

      box-shadow:
        0 10px 25px rgba(120, 75, 57, 0.12);

      transition: 0.25s ease;
    }

    .contact-button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 15px 30px rgba(120, 75, 57, 0.18);
    }

    /* =========================
       PHOTO
    ========================= */

    .photo-area {
      position: relative;

      min-height: 650px;

      display: flex;

      align-items: flex-end;
      justify-content: center;
    }

    .photo-circle {
      position: absolute;

      width: min(570px, 100%);

      aspect-ratio: 1;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.34);

      border: 1px solid rgba(255, 255, 255, 0.7);

      box-shadow:
        inset 0 0 60px rgba(255, 255, 255, 0.15);
    }

    .photo-frame {
      position: relative;
      z-index: 2;

      width: min(590px, 100%);

      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    .photo-frame img {
      width: 100%;

      max-height: 690px;

      object-fit: contain;
      object-position: center bottom;

      filter:
        drop-shadow(
          20px 25px 18px rgba(64, 42, 34, 0.15)
        );
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      position: absolute;

      bottom: 20px;
      left: 0;
      right: 0;

      text-align: center;

      color: rgba(70, 78, 85, 0.65);

      font-size: 10px;
    }

    /* =========================
       ANIMATION
    ========================= */

    .fade {
      opacity: 0;

      transform: translateY(20px);

      animation:
        fadeUp 0.9s ease forwards;
    }

    .fade.delay-1 {
      animation-delay: 0.12s;
    }

    .fade.delay-2 {
      animation-delay: 0.25s;
    }

    .fade.delay-3 {
      animation-delay: 0.4s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: none;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      .header {
        top: 12px;

        width: calc(100% - 24px);

        padding: 9px 12px;
      }

      .brand {
        font-size: 12px;
      }

      .coming-soon {
        padding:
          105px 0
          80px;
      }

      .coming-grid {
        grid-template-columns: 1fr;

        gap: 15px;
      }

      .content {
        padding: 0;

        text-align: center;
      }

      .description {
        margin-left: auto;
        margin-right: auto;
      }

      .line {
        margin-left: auto;
        margin-right: auto;
      }

      .actions {
        justify-content: center;
      }

      .photo-area {
        min-height: 450px;
      }

      .photo-circle {
        width: min(430px, 95%);
      }

      .photo-frame {
        width: min(450px, 100%);
      }

      .photo-frame img {
        max-height: 500px;
      }

      .footer {
        position: relative;

        margin-top: -55px;

        padding-bottom: 18px;
      }
    }

    @media (max-width: 500px) {

      .lang {
        padding: 6px 7px;

        font-size: 9px;
      }

      .title {
        font-size: 58px;
      }

      .photo-area {
        min-height: 380px;
      }

      .photo-frame img {
        max-height: 420px;
      }

      .description {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- HEADER -->
    <header class="header">

      <a href="#" class="brand">
        Vũ Nguyệt Ánh
      </a>

      <div class="header-right">

        <button
          class="lang active"
          data-lang="vi"
          type="button"
        >
          VI
        </button>

        <button
          class="lang"
          data-lang="en"
          type="button"
        >
          EN
        </button>

        <button
          class="lang"
          data-lang="fr"
          type="button"
        >
          FR
        </button>

      </div>

    </header>


    <!-- MAIN -->
    <main class="coming-soon">

      <div class="container">

        <div class="coming-grid">

          <!-- TEXT -->
          <div class="content">

            <p
              class="kicker fade"
              data-i18n="kicker"
            >
              Website personnel
            </p>

            <h1
              class="title fade delay-1"
              data-i18n="title"
            >
              Coming
              <em>Soon</em>
            </h1>

            <div class="line fade delay-2"></div>

            <p
              class="description fade delay-2"
              data-i18n="description"
            >
              Website đang được hoàn thiện.
              <br>
              <strong>Vũ Nguyệt Ánh</strong>
              sẽ sớm trở lại với một không gian mới
              để chia sẻ về hành trình,
              công việc, các dự án và hoạt động của mình.
            </p>

            <div class="actions fade delay-3">

              <a
                href="mailto:vu@nguyetanh.biz"
                class="contact-button"
                data-i18n="contact"
              >
                <i class="fa-regular fa-envelope"></i>
                Liên hệ
              </a>

            </div>

          </div>


          <!-- PHOTO -->
          <div class="photo-area fade delay-2">

            <div class="photo-circle"></div>

            <div class="photo-frame">

              <img
                src="https://image-namanhstudio.weebly.com/uploads/1/5/5/3/155356283/48a8384f-8796-4875-800f-0182ff220282_orig.png"
                alt="Vũ Nguyệt Ánh"
                loading="eager"
              >

            </div>

          </div>

        </div>

      </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

      © 2026 Vũ Nguyệt Ánh ·
      www.nguyetanh.biz

    </footer>

  </div>


  <script>

    const translations = {

      vi: {
        kicker: "Website cá nhân",

        title: "Coming<br><em>Soon</em>",

        description:
          'Website đang được hoàn thiện.<br><strong>Vũ Nguyệt Ánh</strong> sẽ sớm trở lại với một không gian mới để chia sẻ về hành trình, công việc, các dự án và hoạt động của mình.',

        contact: '<i class="fa-regular fa-envelope"></i> Liên hệ'
      },

      en: {
        kicker: "Personal website",

        title: "Coming<br><em>Soon</em>",

        description:
          'The website is currently under construction.<br><strong>Vũ Nguyệt Ánh</strong> will be back soon with a new space to share her journey, work, projects and activities.',

        contact: '<i class="fa-regular fa-envelope"></i> Contact'
      },

      fr: {
        kicker: "Site personnel",

        title: "Bientôt<br><em>Disponible</em>",

        description:
          'Le site est actuellement en construction.<br><strong>Vũ Nguyệt Ánh</strong> sera bientôt de retour avec un nouvel espace consacré à son parcours, ses projets, son travail et ses activités.',

        contact: '<i class="fa-regular fa-envelope"></i> Contact'
      }

    };


    function setLanguage(lang) {

      const dict =
        translations[lang] ||
        translations.vi;

      document.documentElement.lang = lang;

      document
        .querySelectorAll("[data-i18n]")
        .forEach(element => {

          const key =
            element.dataset.i18n;

          if (dict[key] !== undefined) {

            element.innerHTML =
              dict[key];

          }

        });


      document
        .querySelectorAll(".lang")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.lang === lang
          );

        });

      localStorage.setItem(
        "vna-coming-lang",
        lang
      );

    }


    document
      .querySelectorAll(".lang")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {
            setLanguage(
              button.dataset.lang
            );
          }
        );

      });


    setLanguage(
      localStorage.getItem(
        "vna-coming-lang"
      ) || "vi"
    );

  </script>

</body>
</html>
